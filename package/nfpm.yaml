# Definition of the .deb and .rpm, built from the tree staged by package/build.sh.
#   VERSION=0.1.0 nfpm package --config package/nfpm.yaml --packager deb --target dist/
# Run it from the directory that holds dist/stage (paths below are relative to it).
name: easy-cs-ai
arch: all
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Dimsi <noreply@dimsi.fr>
description: |
  All-in-one zero-conf local AI: installs and wires an inference engine, a
  reverse proxy and a chat interface, from the command line or a configuration.
homepage: https://github.com/Dimsi-BS/easy-cs-ai

contents:
  - src: dist/stage/bin/easy-cs-ai
    dst: /usr/bin/easy-cs-ai
    file_info:
      mode: 0755
  - src: dist/stage/lib/easy-cs-ai
    dst: /usr/lib/easy-cs-ai
    type: tree

# bash, curl and coreutils are on every target; jq, flock (util-linux) and
# envsubst (gettext) are what the scripts need beyond that.
depends:
  - bash
  - curl
  - coreutils
  - jq
  - util-linux
  - gettext-base

overrides:
  rpm:
    depends:
      - bash
      - curl
      - coreutils
      - jq
      - util-linux
      - gettext
