name: Release

# A tag v<version> publishes the tarball, the .deb and the .rpm with their
# .sha256 files, the names the generated VM scripts download (see
# docs/spec-vm-generator.md#package-source).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq

      - name: Tests
        run: |
          shellcheck $(git ls-files '*.sh') package/bin/easy-cs-ai
          bats --recursive tests/unit

      - name: Tarball
        run: package/build.sh --version "$VERSION" --output dist

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: deb and rpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          for packager in deb rpm; do
            "$(go env GOPATH)/bin/nfpm" package --config package/nfpm.yaml --packager "$packager" --target dist/
          done
          # nfpm names them easy-cs-ai_<v>_all.deb and easy-cs-ai-<v>-1.noarch.rpm
          cd dist
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.deb dist/*.deb.sha256 dist/*.rpm dist/*.rpm.sha256
