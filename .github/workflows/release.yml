name: Release

# A tag v<version> publishes the tarball, the .deb and the .rpm with their
# .sha256 files, the names the generated VM scripts download (see
# docs/spec-vm-generator.md#package-source).
#   v0.1.0       a release, marked as the latest one
#   v0.1.0-rc1   a version with a hyphen is a pre-release: published as such, never the latest
# The tag must match CLI_VERSION in package/bin/easy-cs-ai (package/build.sh refuses otherwise).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq

      - name: Tests
        run: |
          shellcheck $(git ls-files '*.sh') package/bin/easy-cs-ai
          bats --recursive tests/unit

      - name: Tarball
        run: package/build.sh --version "$VERSION" --output dist

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: deb and rpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          package/build-native.sh --nfpm "$(go env GOPATH)/bin/nfpm" --output dist
          ls -l dist

      - name: Packaging tests
        run: bash tests/packaging/packages.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$VERSION" == *-* ]]; then kind=(--prerelease); else kind=(--latest); fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${kind[@]}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.deb dist/*.deb.sha256 dist/*.rpm dist/*.rpm.sha256
