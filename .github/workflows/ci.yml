name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: shellcheck and bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq

      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' package/bin)
          if [ "${#scripts[@]}" -gt 0 ]; then shellcheck "${scripts[@]}"; fi

      - name: bats unit tests
        run: bats --recursive tests/unit
