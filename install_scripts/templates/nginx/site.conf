# Managed by easy-cs-ai (nginx.sh): site ${NGX_SITE}
# A web site served over HTTPS for browsers, on its own port and without the API key
# (the API server keeps requiring it on every path). Same certificate as the API server.
map ${DOLLAR}http_upgrade ${DOLLAR}easy_cs_ai_connection_${NGX_SITE_VAR} {
    default upgrade;
    "" close;
}

server {
    listen ${NGX_SITE_LISTEN} ssl;
    server_name ${NGX_SERVER_NAME};

    ssl_certificate ${NGX_CERT};
    ssl_certificate_key ${NGX_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass ${NGX_SITE_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
        proxy_set_header Upgrade ${DOLLAR}http_upgrade;
        proxy_set_header Connection ${DOLLAR}easy_cs_ai_connection_${NGX_SITE_VAR};
        # Streaming (server-sent events): no buffering, and read timeouts above the 60 s default.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
