# Managed by easy-cs-ai (nginx.sh), do not edit: rewritten by `install`.
# ${DOLLAR} is the dollar sign, so that envsubst leaves the nginx variables alone.
include ${NGX_DIR}/api-key.conf;

server {
    listen ${NGX_LISTEN} ssl;
    server_name ${NGX_SERVER_NAME};

    ssl_certificate ${NGX_CERT};
    ssl_certificate_key ${NGX_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;

    default_type application/json;

    # Every path needs the API key, the health probe included.
    if (${DOLLAR}easy_cs_ai_authorized = 0) {
        return 401 '{"error":"missing or invalid API key"}';
    }

    location = /easy-cs-ai/health {
        return 200 '{"status":"ok"}';
    }

    include ${NGX_DIR}/upstreams/*.conf;
}

# Web sites for browsers (add-site): one server each, on its own port, without the API key.
include ${NGX_DIR}/sites/*.conf;
