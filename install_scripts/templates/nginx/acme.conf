# Managed by easy-cs-ai (nginx.sh), do not edit. Only present with --tls letsencrypt:
# answers the HTTP-01 challenge of Let's Encrypt and sends everything else to HTTPS.
server {
    listen 80;
    server_name ${NGX_SERVER_NAME};

    location /.well-known/acme-challenge/ {
        root ${NGX_ACME_ROOT};
    }

    location / {
        return 301 https://${DOLLAR}host${NGX_PORT_SUFFIX}${DOLLAR}request_uri;
    }
}
